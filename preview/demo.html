<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>译界 · 交互演示</title>
<style>
  :root{
    --bg:#fff; --fg:#1a1a1c; --muted:#8b8b95; --line:rgba(0,0,0,.09);
    --accent:#4a5cff; --ok:#0aa06e;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#151517;--fg:#ececf0;--muted:#8a8a95;--line:rgba(255,255,255,.1);--accent:#8b97ff;}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;
    padding-bottom:80px;
  }
  header{
    position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:10px 16px;
  }
  .logo{
    width:28px;height:28px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(135deg,#5b6cff,#8f5bff);color:#fff;
    font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(90,108,255,.35);
  }
  header h1{font-size:15px;font-weight:620;flex:1}
  header .tag{
    font-size:11px;color:var(--muted);border:1px solid var(--line);
    padding:3px 8px;border-radius:99px;
  }
  .btn{
    border:0;border-radius:10px;font:inherit;font-size:13.5px;font-weight:600;
    padding:8px 14px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#5b6cff,#7b62ff);
    box-shadow:0 3px 12px rgba(90,108,255,.3);transition:transform .1s;
  }
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:transparent;color:var(--accent);box-shadow:none;font-weight:500}

  main{max-width:720px;margin:0 auto;padding:26px 22px 40px}
  article h2{font-size:26px;line-height:1.25;letter-spacing:-.02em;margin-bottom:18px;font-weight:680}
  article p{margin-bottom:20px;font-size:16.5px;color:var(--fg)}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:22px;display:flex;gap:10px;align-items:center}
  .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}

  .tr-block{
    display:block;margin-top:6px;padding-left:11px;border-left:2px solid rgba(88,116,255,.42);
    color:var(--fg);opacity:0;transform:translateY(-3px);
    animation:in .3s ease-out forwards;
  }
  @keyframes in{to{opacity:.93;transform:none}}

  .pill{
    position:fixed;right:16px;bottom:20px;z-index:30;
    display:none;align-items:center;gap:8px;
    padding:9px 12px;border-radius:999px;
    background:rgba(28,28,32,.93);color:#fff;font-size:12.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .pill.show{display:flex}
  .pill i{width:8px;height:8px;border-radius:50%;background:#6f7dff;animation:pulse 1s ease-in-out infinite}
  .pill.done i{animation:none;background:#2ecc9a}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

  /* 划词气泡 */
  .bubble{
    position:fixed;z-index:40;width:min(92vw,400px);
    background:#fff;color:#1a1a1c;border-radius:14px;overflow:hidden;
    box-shadow:0 14px 44px rgba(0,0,0,.24),0 2px 8px rgba(0,0,0,.1);
    border:1px solid rgba(0,0,0,.07);
    font-size:14px;line-height:1.45;
    opacity:0;transform:scale(.96) translateY(6px);pointer-events:none;
    transition:opacity .16s,transform .16s;
  }
  @media (prefers-color-scheme:dark){
    .bubble{background:#232327;color:#ececf0;border-color:rgba(255,255,255,.1)}
    .bubble .src{color:#9d9da8;border-color:rgba(255,255,255,.1)}
    .bubble .foot{border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
  }
  .bubble.show{opacity:1;transform:none;pointer-events:auto}
  .bubble .head{display:flex;align-items:center;gap:7px;padding:9px 12px 6px;font-size:11px;color:#8a8a95}
  .bubble .head .t{background:#eef1ff;color:#4a5cff;padding:2px 7px;border-radius:99px;font-weight:650}
  @media (prefers-color-scheme:dark){.bubble .head .t{background:rgba(96,116,255,.16);color:#9aa8ff}}
  .bubble .body{padding:0 12px 11px;max-height:44vh;overflow:auto}
  .bubble .src{font-size:12.5px;color:#6b6b75;padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed rgba(0,0,0,.12)}
  .bubble .dst{font-size:15px;white-space:pre-wrap}
  .bubble .foot{display:flex;border-top:1px solid rgba(0,0,0,.07);background:rgba(0,0,0,.015)}
  .bubble .foot button{flex:1;border:0;background:none;color:#4a4a55;font:inherit;font-size:12.5px;padding:10px 0;cursor:pointer}
  @media (prefers-color-scheme:dark){.bubble .foot button{color:#c9c9d4}}

  .hintbar{
    max-width:720px;margin:0 auto;padding:14px 22px 0;
    font-size:12.5px;color:var(--muted);line-height:1.5;
  }
</style>
</head>
<body>
<header>
  <span class="logo">译</span>
  <h1>交互演示</h1>
  <span class="tag" id="modeTag">未翻译</span>
  <button class="btn" id="toggleBtn">翻译此页</button>
</header>

<div class="hintbar" id="hint">点「翻译此页」看整页双语对照；点任意英文句子，看划词气泡。</div>

<main>
  <article id="article">
    <h2 data-idx="-1">Why we rebuilt our translation pipeline from scratch</h2>
    <div class="meta"><span>Engineering</span><span class="dot"></span><span>6 min read</span><span class="dot"></span><span>Nov 2026</span></div>
  </article>
</main>

<div class="pill" id="pill"><i></i><span>准备中…</span></div>

<div class="bubble" id="bubble">
  <div class="head"><span class="t">译界</span><span class="dir">必应 · zh-CN</span></div>
  <div class="body">
    <div class="src"></div>
    <div class="dst"></div>
  </div>
  <div class="foot">
    <button data-act="copy">复制</button>
    <button data-act="speak">朗读</button>
    <button data-act="swap">换引擎</button>
    <button data-act="close">关闭</button>
  </div>
</div>

<script src="demo-data.js"></script>
<script src="demo.js"></script>
</body>
</html>
