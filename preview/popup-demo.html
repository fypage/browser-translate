<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>译界</title>
<link rel="stylesheet" href="../popup.css">
<style>
body { margin: 24px auto; background: #e9e9ee; }
@media (prefers-color-scheme: dark) { body { background: #0e0e10; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">译</span>
    <div>
      <h1>译界</h1>
      <p id="sub">划词即译 · 整页双语</p>
    </div>
  </div>
  <span class="ver">v1.0</span>
</header>

<button id="pageBtn" class="primary">
  <span id="pageBtnText">翻译当前页面</span>
  <kbd>Alt</kbd><kbd>T</kbd>
</button>

<section>
  <label class="row-label">翻译引擎</label>
  <div class="segment" id="engineSeg"></div>
  <p class="hint" id="engineHint"></p>
</section>

<section>
  <div class="field">
    <label for="targetLang">目标语言</label>
    <select id="targetLang"></select>
  </div>
  <div class="field">
    <label for="sourceLang">源语言</label>
    <select id="sourceLang"></select>
  </div>
</section>

<section class="switches">
  <label class="sw"><input type="checkbox" id="bilingual"><span></span>
    <div><b>双语对照</b><i>原文下方插入译文</i></div>
  </label>
  <label class="sw"><input type="checkbox" id="selectionMode"><span></span>
    <div><b>划词即译</b><i>选中文字自动弹气泡</i></div>
  </label>
  <label class="sw"><input type="checkbox" id="autoTranslate"><span></span>
    <div><b>自动翻译</b><i>外语页面打开即翻</i></div>
  </label>
</section>

<section id="cfgBox" class="cfg">
  <div class="field">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="sk-…">
  </div>
  <div class="field" id="baseUrlField">
    <label for="baseUrl">接口地址</label>
    <input type="text" id="baseUrl" autocomplete="off" spellcheck="false">
  </div>
  <div class="field" id="modelField">
    <label for="model">模型</label>
    <input type="text" id="model" autocomplete="off" spellcheck="false">
  </div>
  <div class="field col" id="glossaryField">
    <label for="glossary">术语表</label>
    <textarea id="glossary" rows="2" spellcheck="false" placeholder="每行一条，如：&#10;token=令牌&#10;workspace=工作台"></textarea>
  </div>
  <p class="hint warn" id="keyHint"></p>
</section>

<footer>
  <span id="cacheInfo">缓存 0 条</span>
  <button id="clearCache" class="link">清除</button>
  <span class="dot">·</span>
  <button id="openShortcuts" class="link">快捷键</button>
</footer>

<script>
/* 预览用 mock：把真实 popup 界面在普通网页里跑起来，不进扩展包 */
const SETTINGS = {
  engine: 'microsoft', targetLang: 'zh-CN', sourceLang: 'auto',
  bilingual: true, autoTranslate: false, selectionMode: 'bubble',
  glossary: 'token=令牌\nworkspace=工作台',
  deepl: { apiKey: '' },
  openai: { baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o-mini', apiKey: '' },
  deepseek: { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat', apiKey: 'sk-demo-xxxxxxxxxxxx' },
};
const LANGS = [['zh-CN','简体中文'],['zh-TW','繁體中文'],['en','English'],['ja','日本語'],['ko','한국어'],['fr','Français'],['de','Deutsch'],['es','Español'],['ru','Русский'],['pt','Português']];
const ENGINES = [
  {id:'microsoft',label:'微软 Edge',free:true},
  {id:'google',label:'Google',free:true},
  {id:'deepseek',label:'DeepSeek',free:false},
  {id:'openai',label:'OpenAI 兼容',free:false},
  {id:'deepl',label:'DeepL',free:false},
];
window.chrome = {
  runtime: {
    lastError: null,
    sendMessage(msg, cb) {
      let r = { ok: true };
      if (msg.type === 'settings:get') r = { ok: true, settings: SETTINGS, langs: LANGS, engines: ENGINES };
      else if (msg.type === 'cache:stats') r = { ok: true, count: 1284 };
      else if (msg.type === 'settings:set') { Object.assign(SETTINGS, msg.patch || {}); r = { ok: true, settings: SETTINGS }; }
      setTimeout(() => cb(r), 8);
    },
  },
  tabs: {
    async query() { return [{ id: 1, url: 'https://example.com/article' }]; },
    sendMessage(id, msg, cb) { if (cb) cb({ ok: true, active: false }); },
    create() {},
  },
  permissions: { async contains() { return true; }, async request() { return true; } },
  scripting: {},
};
</script>
<script src="../popup.js"></script>
</body>
</html>
